<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="">
  <title>E-commerce de Roupas | Carrinho</title>

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/liquid-glass.css">
  <link rel="stylesheet" href="css/animations.css">
</head>

<body>

  <header class="site-header">
    <nav class="site-nav" aria-label="Navegação principal"></nav>
  </header>

  <main class="site-main">
    <h1>Seu Carrinho de Compras</h1>
    <p>Confira os itens selecionados antes de finalizar a compra</p>
    <aside class="column column-left" aria-label="Coluna lateral esquerda"></aside>

    <section class="column column-center" aria-label="Conteúdo do carrinho">
       <!-- Lista dos itens do carrinho -->
        <div class= "carrinho-itens">
          <article class= "item-carrinho">
            <h3>Camiseta casual</h3>
            <p>Quantidade: 1</p>
            <p>Preço: R$ 59,90</p>
            <button type="button">Remover</button>
          </article> 
          
          <article class="item-carrinho">
            <h3>Calça Jeans Slim</h3>
            <p>Quantidade: 1</p>
            <p>Preço: R$ 120,00</p>
            <button type="button">Remover</button>
            </article>
        </div>
        <!-- Resumo do valor total e botão de compra -->
         <div class="carrinho-resumo">
          <h2>Resumo do Pedido</h2>
          <p><strong>Total:</strong>R$ 179,90</p>
          <button type="button"> Finalizar Compra</button>
         </div>
    </section>

    <aside class="column column-right" aria-label="Coluna lateral direita"></aside>
  </main>

  <footer class="site-footer"></footer>

  <script src="js/main.js"></script>
</body>
</html>
